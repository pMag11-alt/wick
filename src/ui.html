<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wick</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --text: #1d1c1a; --muted: #77736b; --line: #e3e0d9;
    --user: #ece9e2; --accent: #c2410c; --accent-text: #ffffff; --code: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --panel: #1f1e1b; --text: #ece9e2; --muted: #9a958b; --line: #34322d;
            --user: #2b2925; --accent: #f97316; --accent-text: #161513; --code: #2a2824; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  header .model { color: var(--muted); font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  header input { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
                 background: var(--panel); color: var(--text); font: inherit; font-size: 13px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .msg { max-width: 760px; margin: 0 auto 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); border-radius: 12px; padding: 10px 14px; width: fit-content; margin-right: max(16px, calc((100% - 760px) / 2)); margin-left: auto; max-width: min(620px, 85%); }
  .msg.assistant { padding: 0 2px; }
  .msg .stats { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  form { display: flex; gap: 10px; max-width: 792px; width: 100%; margin: 0 auto; padding: 12px 16px 20px; }
  textarea { flex: 1; resize: none; min-height: 46px; max-height: 200px; padding: 12px 14px; border-radius: 12px;
             border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  @media (max-width: 600px) { header label.opt { display: none; } }
</style>
</head>
<body>
<header>
  <h1>wick</h1><span class="model" id="model">…</span><span class="spacer"></span>
  <label class="opt">temperature <input id="temp" type="number" step="0.1" min="0" max="2" value="0.7"></label>
  <label class="opt">max tokens <input id="max" type="number" min="1" max="8192" value="512"></label>
  <button id="clear" type="button">New chat</button>
</header>
<div id="log"><div class="empty">Ask anything. Replies stream from the model running on this machine's CPU.</div></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message" autofocus></textarea>
  <button class="primary" id="send">Send</button>
</form>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
let history = [];
let busy = null;

fetch('/v1/models').then(r => r.json()).then(j => {
  const m = j.data[0];
  document.getElementById('model').textContent = `${m.id} · ${m.quantization} · ${m.context_length} ctx`;
});

function add(role, text) {
  if (log.querySelector('.empty')) log.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function chat(text) {
  history.push({role: 'user', content: text});
  add('user', text);
  const out = add('assistant', '');
  const controller = new AbortController();
  busy = controller;
  send.textContent = 'Stop';
  let reply = '';
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, signal: controller.signal,
      body: JSON.stringify({messages: history, stream: true,
        temperature: +document.getElementById('temp').value, max_tokens: +document.getElementById('max').value}),
    });
    if (!res.ok) throw new Error((await res.json()).error.message);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const event = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!event.startsWith('data: ') || event === 'data: [DONE]') continue;
        const j = JSON.parse(event.slice(6));
        const delta = j.choices[0].delta.content || '';
        reply += delta;
        out.textContent = reply;
        if (j.timings) {
          const s = document.createElement('span');
          s.className = 'stats';
          s.textContent = `${j.usage.prompt_tokens} prompt tokens (${j.usage.prompt_tokens_details.cached_tokens} cached) · ` +
            `${j.usage.completion_tokens} tokens at ${j.timings.predicted_per_second} tok/s`;
          out.appendChild(s);
        }
        log.scrollTop = log.scrollHeight;
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') out.textContent = reply + `\n[error: ${e.message}]`;
  }
  history.push({role: 'assistant', content: reply});
  busy = null;
  send.textContent = 'Send';
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) { busy.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = '';
  chat(text);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
});
input.addEventListener('input', () => { input.style.height = ''; input.style.height = input.scrollHeight + 'px'; });
document.getElementById('clear').addEventListener('click', () => {
  if (busy) busy.abort();
  history = [];
  log.innerHTML = '<div class="empty">New chat.</div>';
});
</script>
</body>
</html>
